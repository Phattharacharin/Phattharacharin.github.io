<!DOCTYPE html>
<html>
<head>
<title>My First Three.js Cube</title>
<style>
body { margin: 0; overflow: hidden; } /* ลบ margin เริ่มต้นของ body และซ่อน scrollbar */
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// โค้ด Three.js ของเราจะมาที่นี่
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight); // กำหนดขนาดของ Renderer ให้เท่ากับขนาดหน้าจอเบราว์เซอร์
document.body.appendChild(renderer.domElement); // เพิ่ม Canvas ของ Renderer เข้าไปใน body ของ HTML
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 5;

const cubeGeometry = new THREE.BoxGeometry(1,1,1);
const cubeMesh = new THREE.Mesh(cubeGeometry);
scene.add(cubeMesh);


function animate() {
    requestAnimationFrame(animate);
    cubeMesh.rotation.x += 0.01; // หมุนลุกบาศก์รอบแกน X
    cubeMesh.rotation.y += 0.01; // หมุนลุกบาศก์รอบแกน Y
    renderer.render(scene, camera);
}
animate(); // เริ่มการทำงานฟังก์ชัน animate

renderer.render(scene, camera);
</script>
</body>
</html>
