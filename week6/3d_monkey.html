3, -4.062, -0.0127
        
        ];

        let angleX = 0;
        let angleY = 0;

        // คำนวณขอบเขตของโมเดล
        let minX=Infinity, maxX=-Infinity;
        let minY=Infinity, maxY=-Infinity;
        let minZ=Infinity, maxZ=-Infinity;
        
        for(let i=0; i<vertices.length; i+=3) {
            let bx = vertices[i];
            let by = vertices[i+1];
            let bz = vertices[i+2];
            
            // !! แก้ปัญหาหัวลีบ !!
            // Blender ใช้ Z เป็นแกนตั้ง และ Y เป็นแนวลึก
            // แต่ Canvas 3D ปกติจะใช้ Y เป็นแกนตั้ง และ Z เป็นแนวลึก
            // ดังนั้นเราต้องสลับแกน Y กับ Z และกลับด้านให้ถูกต้อง
            let x = bx;
            let y = -bz; 
            let z = by;  
            
            // อัพเดทพิกัดใหม่ทับของเดิม
            vertices[i] = x;
            vertices[i+1] = y;
            vertices[i+2] = z;

            minX = Math.min(minX, x);
            maxX = Math.max(maxX, x);
            minY = Math.min(minY, y);
            maxY = Math.max(maxY, y);
            minZ = Math.min(minZ, z);
            maxZ = Math.max(maxZ, z);
        }
        
        const centerX = (minX + maxX)/2;
        const centerY = (minY + maxY)/2;
        const centerZ = (minZ + maxZ)/2;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cosX = Math.cos(angleX);
            const sinX = Math.sin(angleX);
            const cosY = Math.cos(angleY);
            const sinY = Math.sin(angleY);

            // !! แก้ปัญหาหัวบิดเบี้ยว (Perspective Distortion) !!
            // ถอยกล้องออกไปให้ไกลขึ้น (finalZ + 10) และเพิ่มระยะ fov เพื่อให้ภาพไม่บิดเบี้ยวเหมือนเลนส์ Fish-eye
            const fov = 350; 
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            function project(x, y, z) {
                x -= centerX;
                y -= centerY;
                z -= centerZ;

                let y1 = y * cosX - z * sinX;
                let z1 = y * sinX + z * cosX;
                let x2 = x * cosY + z1 * sinY;
                let z2 = -x * sinY + z1 * cosY;
                
                let finalZ = z2 + 10; // ถอยกล้องออกไปให้ไกลขึ้น 
                
                return {
                    x: (x2 / finalZ) * fov + cx,
                    y: (y1 / finalZ) * fov + cy,
                    origX: x2,
                    origY: y1,
                    origZ: z2,
                    z: finalZ
                };
            }

            let triangles = [];

            // กำหนดทิศทางแสง (ส่องมาจากมุมบนซ้าย เฉียงๆ)
            let lx = -0.6, ly = -0.6, lz = -1.0;
            let llen = Math.sqrt(lx*lx + ly*ly + lz*lz);
            lx /= llen; ly /= llen; lz /= llen;

            for (let i = 0; i < vertices.length; i += 9) {
                let p1 = project(vertices[i], vertices[i+1], vertices[i+2]);
                let p2 = project(vertices[i+3], vertices[i+4], vertices[i+5]);
                let p3 = project(vertices[i+6], vertices[i+7], vertices[i+8]);

                let ux = p2.origX - p1.origX;
                let uy = p2.origY - p1.origY;
                let uz = p2.origZ - p1.origZ;
                let vx = p3.origX - p1.origX;
                let vy = p3.origY - p1.origY;
                let vz = p3.origZ - p1.origZ;

                let nx = uy * vz - uz * vy;
                let ny = uz * vx - ux * vz;
                let nz = ux * vy - uy * vx;

                if (nz > 0) continue;

                let nlen = Math.sqrt(nx*nx + ny*ny + nz*nz);
                nx /= nlen; ny /= nlen; nz /= nlen;
                
                // คำนวณความสว่างตามมุมตกกระทบของแสง
                let dot = (nx * lx + ny * ly + nz * lz);
                let intensity = Math.max(0.15, dot); // มีแสงพื้นฐาน (Ambient) 15% จะได้ไม่ดำมืด

                let zAvg = (p1.z + p2.z + p3.z) / 3;

                triangles.push({
                    pts: [p1, p2, p3],
                    zAvg: zAvg,
                    intensity: intensity
                });
            }

            triangles.sort((a, b) => b.zAvg - a.zAvg);

            for (let tri of triangles) {
                // ทำสีเทา-ขาว ให้มีมิติเงา
                let baseColor = 220; 
                let colorVal = Math.floor(baseColor * tri.intensity);
                
                // ถ้ารับแสงตรงๆ ให้สว่างปิ๊ง (Specular Highlight)
                if(tri.intensity > 0.85) {
                    colorVal = Math.min(255, colorVal + 60);
                }

                ctx.fillStyle = `rgb(${colorVal}, ${colorVal}, ${colorVal})`;
                ctx.strokeStyle = `rgb(${colorVal}, ${colorVal}, ${colorVal})`; 
                ctx.lineWidth = 0.5; 

                ctx.beginPath();
                ctx.moveTo(tri.pts[0].x, tri.pts[0].y);
                ctx.lineTo(tri.pts[1].x, tri.pts[1].y);
                ctx.lineTo(tri.pts[2].x, tri.pts[2].y);
                ctx.closePath();
                
                ctx.fill();
                ctx.stroke();
            }

            angleX += 0.008;
            angleY += 0.015;

            requestAnimationFrame(draw);
        }

        draw();
